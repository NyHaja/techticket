name: techticket

services:
  # ─── Reverse proxy + frontend : le SEUL service exposé ───
  web:
    # build:
    #   context: .
    #   dockerfile: apps/web/Dockerfile
    # image: techticket-web
    image: ghcr.io/nyhaja/techticket-web:${TAG:?La variable TAG doit indiquer la version à déployer}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data # ⚠️ les certificats HTTPS : à conserver absolument
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [front]

  # ─── API NestJS : aucun port publié ───
  api:
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    # image: techticket-api
    image: ghcr.io/nyhaja/techticket-api:${TAG:?La variable TAG doit indiquer la version à déployer}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [front, back]

  # ─── Migrations : s'exécute une fois puis s'arrête ───
  migrate:
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    # image: techticket-api
    image: ghcr.io/nyhaja/techticket-api:${TAG:?La variable TAG doit indiquer la version à déployer}
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [back]

  # ─── Base de données : aucun port publié ───
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]

  # ─── Redis (sessions) : protégé par mot de passe, aucun port publié ───
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]

networks:
  front:
  back:
    internal: true # aucun accès à Internet pour la base et Redis

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config: