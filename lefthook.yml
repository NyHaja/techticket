pre-push:
  commands:
    lockfile-commite:
      run: git diff --quiet HEAD -- pnpm-lock.yaml
      fail_text: "pnpm-lock.yaml contient des modifications non commitées. Lance : git add pnpm-lock.yaml puis git commit"

    lockfile-a-jour:
      run: pnpm install --frozen-lockfile --lockfile-only
      fail_text: "pnpm-lock.yaml n'est pas à jour avec les package.json. Lance : pnpm install, puis commite pnpm-lock.yaml"