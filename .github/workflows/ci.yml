name: CI
## Ce fichier dit à GitHub :
    # à chaque pull request, prends une machine Linux neuve, installe le projet
    # génère le client Prisma, vérifie les types TypeScript et build le projet.

on: 
    pull_request:
        branches: [main]

jobs:
    api:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api
        env:
            DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm prisma generate
            - name: Vérification des types
              run: pnpm exec tsc --noEmit
            - name: Build
              run: pnpm build