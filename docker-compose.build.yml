# Override pour construire les images en LOCAL (jamais utilisé sur le serveur).
# Usage : docker compose -f docker-compose.prod.yml -f docker-compose.build.yml --env-file .env.prod up -d --build
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile